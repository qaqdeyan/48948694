name: Export zipalign runtime
on:
  push:
    paths:
      - '.github/workflows/import-v48-encrypted-kit.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ZIPALIGN: /usr/local/lib/android/sdk/build-tools/36.0.0/zipalign
    steps:
      - uses: actions/checkout@v4
      - name: Collect libc++ for zipalign
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/runtime
          ldd "$ZIPALIGN" | tee /tmp/ldd.txt
          LIBCPP=$(ldd "$ZIPALIGN" | awk '/libc\+\+\.so/{print $3; exit}')
          test -n "$LIBCPP"
          cp -L "$LIBCPP" /tmp/runtime/libc++.so
          sha256sum /tmp/runtime/libc++.so
          ls -lh /tmp/runtime/libc++.so
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipalign-libcpp
          path: /tmp/runtime/libc++.so
          compression-level: 0
