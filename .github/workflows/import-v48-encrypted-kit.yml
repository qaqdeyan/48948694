name: Import encrypted v48 delivery kit
on:
  push:
    paths:
      - '.github/workflows/import-v48-encrypted-kit.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download encrypted v48 kit
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 -o /tmp/v48-kit.cms https://paste.c-net.org/b2930a9c-cd0e-e237-7e29-35e8d5bbcb2a
          echo '265cf542816b1c64ca215e0b7d8dd2b000c6978485b16627943edb44b26f8e48  /tmp/v48-kit.cms' | sha256sum -c -
          ls -lh /tmp/v48-kit.cms
      - name: Upload encrypted kit artifact
        uses: actions/upload-artifact@v4
        with:
          name: v48-encrypted-kit-new
          path: /tmp/v48-kit.cms
          compression-level: 0
