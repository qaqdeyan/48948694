name: Test binary artifact bridge
on:
  push:
    paths:
      - '.github/workflows/import-v48-encrypted-kit.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate probe
        run: printf 'artifact-bridge-ok\n' > probe.bin
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-bridge-probe
          path: probe.bin
          compression-level: 0
